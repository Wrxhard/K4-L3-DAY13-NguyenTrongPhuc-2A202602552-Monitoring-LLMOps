service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: 'Baseline CP0 P95 1672 ms, dưới 3000 ms; giữ ngưỡng 3000 ms để phát hiện chậm rõ rệt. Một request chỉ tốt khi có response_sent trong 3000 ms. Budget 28 ngày = 0.005 * tổng request_received, tương đương 5 request xấu trên 1000 request.'
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
